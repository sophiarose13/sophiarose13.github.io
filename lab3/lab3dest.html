<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search Results</title>
    </head>
    <body>
        <h2>Search Results</h2>

        <div id="resultOutput">
            <p>Loading...</p>
        </div>

        <script>
            const queryString = window.location.search;
            const urlParams = new URLSearchParams(queryString);
            const queryValue = urlParams.get("query");

            const outputDiv = document.getElementById("resultOutput");
            if(queryValue) {
                outputDiv.innerHTML = 
                <p>Query Value: ${queryValue}</p>
                ;
            }
            
            else {
               outputDiv.innerHTML = `
                    <p>Go back to previous page to input data</p>
                    <a href="lab3.html">Back</a>
                `;
            }
            </script>
            </body>
            </html>
