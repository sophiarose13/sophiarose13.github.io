<!DOCTYPE html>
<html>
    <head>
<title>Web Storage</title>
<link rel="stylesheet" href ="style.css">
    </head>
    <body>
        <!--Local storage example-->
        <div class="box">
            <h3>Local Storage (Strings/Numbers)</h3>
            <p>Level: <span id="level">1</span></p>
            <button onclick="levelUp()">Level Up</button>
            <button onclick="saveLevel()">Save</button>
            <button onclick="loadSave()">Load</button>
        </div>
        <!--Temporary/session storage example-->
        <div class ="box">
            <h3>Temp Storage</h3>
            <p>Current data: <span id="data">Empty</span></p>
            <input type="text" id="data-input" placeholder="Type a message">
            <button onclick="saveData()">Temp Save</button>
            <button onclick="loadData()">Temp Load</button>
        </div>

        <script src="script.js"></script>
    </body>
</html>
